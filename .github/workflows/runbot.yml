name: "Run IWPT bot"
on:
  schedule:
    # Daily at 09:42am, UTC
    - cron: '42 9 * * *'

jobs:
  run-iwpt-bot:
    strategy:
      fail-fast: false
      # Linux runner
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Set env"
        run: |
          set -euxo pipefail
          echo "TODAY_ISO8601=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: "Install deps"
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install pari-gp

      - name: "Checkout code"
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      # A same-day re-run starts from a fresh checkout of the base branch, which
      # does not carry today's log file while its pull request is still open.
      # Restoring the file from the open branch lets the bot see that today has
      # already been dealt with: it does not post twice, and it regenerates
      # identical content, so create-pull-request finds the branch even with its
      # remote and pushes no new commit. Once the pull request is merged, the
      # file comes with the checkout, and the branch is gone.
      - name: "Restore today's log from an open pull request branch, if any"
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}/
          logfile="logs/${TODAY_ISO8601}.log"
          if git fetch --depth=1 origin "log/${TODAY_ISO8601}.log"; then
            git restore --source=FETCH_HEAD -- "${logfile}"
            echo "Restored ${logfile} from the open pull request branch"
          else
            echo "No open pull request branch for ${TODAY_ISO8601}"
          fi

      - name: "Run bot"
        run: |
          set -euxo pipefail
          cd ${{ github.workspace }}/
          make install
          ./iwpt_bot_run.sh
        env:
          IWPT_API_KEY: '${{ secrets.IWPT_API_KEY }}'
          IWPT_API_SECRET: '${{ secrets.IWPT_API_SECRET }}'
          IWPT_ACCESS_TOKEN: '${{ secrets.IWPT_ACCESS_TOKEN }}'
          IWPT_ACCESS_SECRET: '${{ secrets.IWPT_ACCESS_SECRET }}'

      - name: "Create Pull Request"
        id: cpr
        # v8.1.1
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add log for ${{ env.TODAY_ISO8601 }}"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: "log/${{ env.TODAY_ISO8601 }}.log"
          delete-branch: true
          title: "Add log for ${{ env.TODAY_ISO8601 }}"
          body: |
            Add today's IWPT log
            - Posting status: `${{ env.IWPT_TWEET_STATUS || 'unknown' }}`
            - Posting detail: `${{ env.IWPT_TWEET_DETAIL || 'n/a' }}`
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            iwpt log
            automated pr
          assignees: syncom
          reviewers: syncom
          draft: false
          base: ${{ github.head_ref }}

      # Runs after the pull request has been created, so that a failure to
      # post still surfaces in the workflow run, without holding back the log.
      - name: "Report posting failure"
        if: ${{ env.IWPT_TWEET_STATUS == 'failed' }}
        run: |
          set -euo pipefail
          echo "::error::Posting for ${TODAY_ISO8601} failed: ${IWPT_TWEET_DETAIL}"
          exit 1
